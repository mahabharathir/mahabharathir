
name: Update LeetCode Card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate LeetCode SVG
        env:
          LEETCODE_USERNAME: QZVx2lKXnu
          OUTPUT_PATH: assets/leetcode-card.svg
        run: python scripts/generate_leetcode_card.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-card.svg
          git diff --cached --quiet || git commit -m "chore: update LeetCode profile card"
          git push
